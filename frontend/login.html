<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Daily Routine Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    .auth-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 10px;
    }
    button:hover {
      background: #5568d3;
    }
    .toggle-btn {
      background: #764ba2;
      width: 100%;
      text-align: center;
    }
    .toggle-btn:hover {
      background: #6a3e94;
    }
    .error {
      color: #d32f2f;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }
    .success {
      color: #388e3c;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div id="loginForm">
      <h2>Login</h2>
      <div id="loginError" class="error"></div>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <button class="toggle-btn" onclick="toggleForms()">Create Account</button>
    </div>

    <div id="signupForm" style="display: none;">
      <h2>Sign Up</h2>
      <div id="signupError" class="error"></div>
      <div id="signupSuccess" class="success"></div>
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password">
      <input id="signupPassword2" type="password" placeholder="Confirm Password">
      <button onclick="signup()">Sign Up</button>
      <button class="toggle-btn" onclick="toggleForms()">Back to Login</button>
    </div>
  </div>

  <script>
    function toggleForms() {
      document.getElementById("loginForm").style.display = 
        document.getElementById("loginForm").style.display === "none" ? "block" : "none";
      document.getElementById("signupForm").style.display = 
        document.getElementById("signupForm").style.display === "none" ? "block" : "none";
    }

    async function login() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorDiv = document.getElementById("loginError");
      errorDiv.textContent = "";

      if (!email || !password) {
        errorDiv.textContent = "Please enter email and password";
        return;
      }

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.message || "Login failed";
          return;
        }

        localStorage.setItem("token", data.token);
        window.location.href = "/";
      } catch (err) {
        errorDiv.textContent = "Connection error. Please try again.";
        console.error(err);
      }
    }

    async function signup() {
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const password2 = document.getElementById("signupPassword2").value;
      const errorDiv = document.getElementById("signupError");
      const successDiv = document.getElementById("signupSuccess");
      errorDiv.textContent = "";
      successDiv.textContent = "";

      if (!email || !password || !password2) {
        errorDiv.textContent = "All fields are required";
        return;
      }

      if (password !== password2) {
        errorDiv.textContent = "Passwords do not match";
        return;
      }

      if (password.length < 6) {
        errorDiv.textContent = "Password must be at least 6 characters";
        return;
      }

      try {
        const res = await fetch("/signup", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.message || "Signup failed";
          return;
        }

        successDiv.textContent = "Account created! Redirecting to login...";
        setTimeout(() => toggleForms(), 2000);
      } catch (err) {
        errorDiv.textContent = "Connection error. Please try again.";
        console.error(err);
      }
    }

    // Allow Enter key
    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        if (document.getElementById("loginForm").style.display !== "none") {
          login();
        } else {
          signup();
        }
      }
    });
  </script>
</body>
</html>
